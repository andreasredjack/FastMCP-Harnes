events {}

http {
    resolver 127.0.0.11 ipv6=off valid=10s;
    limit_req_zone $binary_remote_addr zone=ai_requests:10m rate=10r/s;
    limit_req_status 429;

    server {
        listen 8443 ssl;
        server_name localhost;
        set $litellm_upstream litellm:4000;

        ssl_protocols TLSv1.3;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;

        client_max_body_size 10m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location /v1/ {
            limit_req zone=ai_requests burst=20 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_pass http://$litellm_upstream;
        }

        location /health {
            proxy_pass http://$litellm_upstream/health/liveliness;
        }

        location / {
            return 404;
        }
    }
}
