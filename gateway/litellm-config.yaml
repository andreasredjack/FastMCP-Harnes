model_list:
  - model_name: rag-gpt-oss
    litellm_params:
      model: openai/gpt-oss:20b
      api_base: http://ollama-rag:11434
  - model_name: rag-embedding
    litellm_params:
      model: openai/multilingual-e5-large
      api_base: http://ollama-rag:11434
  - model_name: coding-qwen
    litellm_params:
      model: openai/qwen3-coder-30b
      api_base: http://ollama-coding:11434
  - model_name: coding-qwen-small
    litellm_params:
      model: openai/qwen3-8b
      api_base: http://ollama-coding:11434
  - model_name: coding-gemma
    litellm_params:
      model: openai/gemma-3-4b
      api_base: http://ollama-coding:11434

litellm_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  general_settings:
    database_url: os.environ/LITELLM_DATABASE_URL
    store_model_in_db: false
  drop_params: true
  request_timeout: 120
  json_logs: true

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 0
  allowed_fails: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  require_user_auth: true
